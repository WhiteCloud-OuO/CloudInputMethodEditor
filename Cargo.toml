[workspace]
resolver = "3"
members = [
    "crates/cloudime-core",
    "crates/cloudime-dictionary",
    "crates/cloudime-learning",
    "crates/cloudime-platform",
    "crates/cloudime-lm",
    "crates/cloudime-format",
    "crates/cloudime-translate",
    "crates/cloudime-neural",
    "crates/cloudime-render",
    "crates/cloudime-update",
    "apps/cli", "apps/windows/server", "apps/windows/tsf", "apps/windows/settings", "tools/dict-convert", "tools/release-sign", "apps/windows/tools/cloudime-wordbank-transformer",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/WhiteCloud-OuO/CloudInputMethodEditor"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# 内部 crate
cloudime-core = { path = "crates/cloudime-core" }
cloudime-dictionary = { path = "crates/cloudime-dictionary" }
cloudime-learning = { path = "crates/cloudime-learning" }
cloudime-platform = { path = "crates/cloudime-platform" }
cloudime-lm = { path = "crates/cloudime-lm" }
cloudime-format = { path = "crates/cloudime-format" }
cloudime-translate = { path = "crates/cloudime-translate" }
cloudime-neural = { path = "crates/cloudime-neural" }
cloudime-render = { path = "crates/cloudime-render" }
cloudime-update = { path = "crates/cloudime-update" }

# 外部依赖统一在这里定版本，子 crate 一律 `xxx.workspace = true`
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde_json = "1.0.151"
toml = "1.1.5"
toml_edit = "0.25"
# 快捷候选的日期 / 时间（本地时区）
jiff = "0.2.35"
# 热路径上的字符串键哈希表（词频 / 语言模型 / 个人 n-gram）：SipHash 一次查表几十纳秒，单字母简拼一键要查几万次
foldhash = "0.2.0"
# 繁体输出（OpenCC s2tw，内置词表）；只要简→繁那半
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["s2t-conversion"] }
# .qj 数据容器：mmap 打开、结构体数组零拷贝读取
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
# 词库存档（WordBank 下的 .db）；bundled 自带 SQLite 源码，装机包不依赖外部 sqlite3
rusqlite = { version = "0.40.2", features = ["bundled"] }

# 本地神经语言模型推理（字级 Transformer，权重 safetensors）
candle-core = "0.11.0"
candle-nn = "0.11.0"

# 检查更新与网络读 releases.json 的异步 HTTP 客户端
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1.53.1", features = ["rt", "time"] }

# 检查更新：releases.json 的 ed25519 签名（发版时 tools/release-sign 签，客户端验）
ed25519-dalek = "3.0.0"
base64 = "0.23.1"

# 自绘渲染器：CPU 栅格 + 文字整形/回退/栅格（fontdb / rustybuzz / swash）
tiny-skia = "0.12.0"
# 状态条 SVG 图标栅格化；关默认特性：不扫系统字体（图标里没有文字）、不要 svgz 与光栅图解码
resvg = { version = "0.48.1", default-features = false }
# 不开 fontconfig：不扫系统字体库，字体文件由渲染器按清单自己加载
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
png = "0.18.1"

# Windows 平台层
embed-manifest = "1.4.0"
windows-registry = "0.6.1"

# cosmic-text 加了 opsz 光学字号支持（FontSystem::set_optical_size），补丁在 qingjian-team 的 fork，分支 qingjian-opsz 基于 0.19.0；
# 上游收了就删掉这段回 crates.io。见 docs/design/rendering.md
[patch.crates-io]
cosmic-text = { git = "https://github.com/qingjian-team/cosmic-text", rev = "9cf0d65a5e4db381e34907103326673386096be3" }
