# 形码输入方案：五笔86
#
# 目录约定（与双键拼音的方案目录同级）：
#   InputSchemes/ShapeCode/
#     use_input_scheme.cfg   scheme = wubi
#     wubi/
#       scheme.toml          本文件
#       table.tsv            编码<TAB>文字<TAB>权重
#     cangjie/  shengbi/     以后的方案，一个方案一个目录

[Info]
Name = "五笔86"
Version = "1.0"
Author = "极点五笔社区数据 / 云朵输入法"

[Shape]
# 码表文件，相对本方案目录（`..` 表示上一层）。
Table = "table.tsv"

# 一级简码表：一行 `键<TAB>字`（`g → 一`）；单键输入时排第一，带 [①] 角标。留空 = 没有一级简码。
LevelOne = "level1.tsv"

# 字根表（键位映射参考用）：一行 `键<TAB>字根 字根…`。留空 = 不显示字根。
Roots = "roots.tsv"

# 可选：自带字根字体。想让字根用专门的字体画（PUA 码位）时加下面三行，并把字体放进本目录；
# 字体文件不在、或 PUA 字根表读不出来时自动退回上面的普通汉字字根，所以默认不写。
# RootsPua = "roots_pua.tsv"
# RootFont = "zigen.otf"
# RootFontFamily = "云朵字根"

# 最长编码长度：五笔 1–4 键，超过 4 位的编码按写错跳过。
MaxCodeLength = 4

# 这个方案支持的设置项（五笔特有的三项 + 键位映射参考）。没写的方案在设置页不显示这些开关，
# 运行时也不生效；仓颉 / 声笔以后有自己的一套选项时，往这里加自己的能力位。
[Options]
MixtureInput = true
UniqueCommit = true
FifthKeyCommit = true
KeyMap = true
