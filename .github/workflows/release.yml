# 推 `v<版本>` 或 `windows-v<版本>` 标签发版（当前只有 Windows 一个平台）。
# 版本号读 apps/windows/{server,tsf,settings}/Cargo.toml（三个一起改，打包读 server），必须与标签一致。
# 流程：prepare 核对版本、建草稿 Release → windows job 打包，把安装包与摘要 / 构建信息片段传到草稿上
# → publish 合并片段、转正、生成并签名 releases.json、触发官网构建。打包失败会停在草稿，不会发出缺内容的版本。
# 流程见 docs/notes/release.md。
# Windows 现在没有代码签名（CLOUDIME_UIACCESS=0 关掉 uiAccess，否则没签名的 Server 起不来），证书办下来再加 signtool。
# 版本索引的签名（必须，没配门禁直接失败）：
#   CLOUDIME_INDEX_SIGNING_KEY   releases.json 的 ed25519 私钥（base64 的 32 字节，tools/release-sign keygen 生成），
#                                公钥在 crates/cloudime-update/src/index/signature.rs；软件内检查更新只认签过名的索引
# 发版后让官网重新构建（也可选）：
#   CLOUDIME_WEB_TOKEN           fine-grained PAT，对 WhiteCloud-OuO/CloudInputMethodEditor-web 有 Contents: read and write
#                                （官网由 Cloudflare 按仓库提交自动构建，tools/release/bump-website.sh 往那边推一个小提交）
#
# 门禁：版本号与标签一致且不带 -dev；标签指向的提交必须在 main 上（防止从没合并的分支或手滑的本地提交发版）。
# Secrets 不放 workflow 顶层 env，只注入真正用它的那一步；有没有配由第一步算成输出（secrets 不能直接写在 if 里）。
# actions 钉到 commit（注释是对应标签），Dependabot 每周更新；产品数据与本地整句模型按 tools/release/data.lock 钉住的 data-vN Release 下载、按锁文件里的哈希校验，标签与哈希记进 build-info.json。
name: release

on:
  push:
    tags: ['v*', 'windows-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.gate.outputs.version }}
      windows: ${{ steps.gate.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions match tag and tag is on main
        id: gate
        env:
          INDEX_KEY_SET: ${{ secrets.CLOUDIME_INDEX_SIGNING_KEY != '' }}
        run: |
          if [[ "$INDEX_KEY_SET" != "true" ]]; then
            echo "没配 CLOUDIME_INDEX_SIGNING_KEY：releases.json 签不了名，已装的云朵输入法都不认这份索引、收不到更新提示（docs/notes/release.md）" >&2
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*) PLATFORMS="windows"; VERSION="${GITHUB_REF_NAME#v}" ;;
            *-v*) PLATFORMS="${GITHUB_REF_NAME%%-v*}"; VERSION="${GITHUB_REF_NAME#*-v}" ;;
          esac
          declare -A MANIFEST=([windows]=apps/windows/server/Cargo.toml)
          for platform in $PLATFORMS; do
            found="$(sed -n 's/^version = "\(.*\)"/\1/p' "${MANIFEST[$platform]}" | head -1)"
            if [[ "$found" != "$VERSION" ]]; then
              echo "${MANIFEST[$platform]} 是 $found，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
              exit 1
            fi
          done
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          for platform in windows; do
            [[ " $PLATFORMS " == *" $platform "* ]] && on=true || on=false
            echo "$platform=$on" >> "$GITHUB_OUTPUT"
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
          WINDOWS: ${{ steps.gate.outputs.windows }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          python3 tools/release/releases_json.py --notes-for "$VERSION" > "$NOTES"
          if [[ "$WINDOWS" == "true" ]]; then
            printf '\n> Windows：这一版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。\n' >> "$NOTES"
          fi
          case "$GITHUB_REF_NAME" in
            windows-v*) TITLE="云朵输入法 Windows $VERSION" ;;
            *) TITLE="云朵输入法 $VERSION" ;;
          esac
          # 带预发布后缀的版本（0.0.1-beta.1）是测试渠道的：标成预发布，不抢 GitHub 的 latest
          PRERELEASE=(); [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease --latest=false)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$TITLE" --notes-file "$NOTES" ${PRERELEASE[@]+"${PRERELEASE[@]}"}

  windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # 没有代码签名证书：Server 不带 uiAccess（没签名的 exe 带 uiAccess=true 起不来）。证书办下来后去掉这一行并在 build.ps1 加 signtool。
      CLOUDIME_UIACCESS: '0'
      PYTHON: python
      # Windows 上 Python 的标准输出缺省 cp1252，中文更新日志会编码失败。
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          # 安装包另带一份 32 位 TSF DLL（build.ps1 编）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated WordBank data/local_models

      # 与开发机同版本（7.1.0，自带简体中文翻译；Chocolatey 只有 6.x，6 的安装包不带简中）。钉死 GitHub Release 上的文件。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（2026-09-11 从上面地址下载后算出），对不上就不装。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload-build.sh windows "$(powershell -NoProfile -Command '(Get-CimInstance Win32_OperatingSystem).Caption' | tr -d '\r')" target/installer/*.exe

  publish:
    needs: [prepare, windows]
    # 没选中的平台是 skipped，照样发；有平台失败就停在草稿
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: echo "website=${{ secrets.CLOUDIME_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Merge checksums and build info, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: tools/release/finish-release.sh "$GITHUB_REF_NAME" "$VERSION" "$RUNNER_TEMP/release"

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDIME_INDEX_SIGNING_KEY: ${{ secrets.CLOUDIME_INDEX_SIGNING_KEY }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          CLOUDIME_WEB_TOKEN: ${{ secrets.CLOUDIME_WEB_TOKEN }}
        run: tools/release/bump-website.sh
