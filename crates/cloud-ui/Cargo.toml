[package]
name = "cloud-ui"
description = "Windows 自绘窗口壳：分层窗口、资产窗口、脚本窗口与 RichEdit 宿主"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 默认只带通用窗口 / 渲染壳；Lua 脚本窗口按需开 `script`（Server 会显式开启）。
default = []
# IME 专用窗口（辅助窗口 / 资产 / 键位映射 / 脚本窗口会用到平台输入方案类型）。
ime = ["dep:cloudime-platform"]
# 脚本窗口（`ScriptWindows` / RichEdit / TSF）；打开它会拖进 LuaJIT。
script = ["ime", "dep:cloudime-script"]

[dependencies]
cloud-ui-core.workspace = true
cloud-ui-types.workspace = true
cloudime-render.workspace = true
cloudime-platform = { workspace = true, optional = true }
cloudime-script = { workspace = true, optional = true }
tracing.workspace = true

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` 展开会引用 `::windows_core`，需要直接依赖
windows-core.workspace = true

[lints]
workspace = true
