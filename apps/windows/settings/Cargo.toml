[package]
name = "cloudime-windows-settings"
version = "0.0.3-dev"
description = "Windows 输入法的设置界面：左侧导航栏 + 各分节表单，读写 %APPDATA%\\CloudIME\\config.toml"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cloudime-settings"
path = "src/main.rs"

[dependencies]
cloudime-platform.workspace = true
toml_edit.workspace = true

# UI 本体只在 Windows 编
[target."cfg(windows)".dependencies]
windows-reactor = "0.100"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
# 只用它的 system_fonts（DirectWrite 列字族）
cloudime-render.workspace = true
cloudime-learning.workspace = true
cloudime-core.workspace = true
cloudime-dictionary.workspace = true
jiff.workspace = true
rfd = "0.17"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
# 自包含部署 Windows App Runtime（Windows 10 上框架依赖的引导用不了，见 build.rs 与 docs\notes\windows-win10.md）
windows-reactor-setup = "0.100"

[lints]
workspace = true
