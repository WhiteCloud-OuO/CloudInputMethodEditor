[package]
name = "cloudime-windows-server"
description = "Windows 输入法的 Server 进程：持有 Engine，跑在应用进程外，与 TSF DLL（../tsf）走 IPC 协议通信"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cloudime-server"
path = "src/main.rs"

# 嵌 uiAccess manifest（见 build.rs）
[build-dependencies]
embed-manifest.workspace = true

[dependencies]
cloudime-core.workspace = true
cloudime-dictionary.workspace = true
cloudime-learning.workspace = true
cloudime-lm.workspace = true
cloudime-neural.workspace = true
cloudime-platform.workspace = true
cloudime-render.workspace = true
cloudime-update.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml_edit.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
